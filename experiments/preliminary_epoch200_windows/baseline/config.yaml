seed: 42
deterministic: true
output_dir: outputs/windows_cuda_epoch200_20261118_042403/baseline
data:
  train_manifest: data/splits/train.jsonl
  val_manifest: data/splits/val.jsonl
  crop_size: 256
  sigma: 4.0
  stride: 8
  support_threshold: 0.001
  num_workers: 0
  pin_memory: true
training:
  epochs: 200
  batch_size: 1
  lr: 1.0e-05
  weight_decay: 0.0001
  selection_start_epoch: 101
  grad_clip_norm: null
model:
  class_path: pygosnet.models.pygosnet.PygosNet
  kwargs:
    use_dcb: false
    pretrained: true
loss:
  class_path: pygosnet.losses.combined.CombinedLoss
  kwargs:
    use_hard_negative: false
device: cuda
